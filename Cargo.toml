[package]
name = "sloyd-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
chromiumoxide = "0.9.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rmcp = { version = "3.4.1", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
